name: Secret Scan

# Blocking secret-scanning gate.
#
# There is deliberately NO `continue-on-error:` anywhere in this file. The
# 2026-07-26 portfolio audit found live credentials in three repos whose
# gitleaks job was set to `continue-on-error: true` — the job went red for
# months and nobody noticed, because a job that cannot fail is a job that is
# not running.
#
# There is also deliberately no hand-rolled `grep` fallback. The greps are what
# failed: they were scoped to `src/**/*.ts` or to `--include=ts,tsx,js,json,env*`
# and every real finding was in a `.md`, `.yml`, `.sh`, `.github/` or `docs/`
# file that those globs skipped.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.28.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan the working tree
        run: |
          gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks-tree.sarif

      - name: Scan the commits introduced by this pull request
        if: github.event_name == 'pull_request'
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1 \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks-tree.sarif
          if-no-files-found: ignore
